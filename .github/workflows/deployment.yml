name: Deployment

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: "🔍 Build"
    uses: vti-do2402/cicd-core/.github/workflows/ci-maven.yml@main

    with:
      runs_on: ${{ vars.RUNS_ON }}
      java_version: ${{ vars.JAVA_VERSION }}
      distribution: ${{ vars.JAVA_DISTRIBUTION }}
      skip_sonar: true
      artifacts: database-service
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  calculate-version:
    name: "📝 Version"
    needs: [build]
    permissions:
      contents: write
    uses: vti-do2402/cicd-core/.github/workflows/tag-and-release.yml@main
    with:
      runs_on: ${{ vars.RUNS_ON }}
      default_bump: ${{ vars.VERSION_BUMP_TYPE }}
      dry_run_tag: true
      draft_release: true
      artifacts: database-service
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: "🚀 Deploy"
    needs: [calculate-version]
    permissions:
      id-token: write
      contents: write
    uses: vti-do2402/cicd-core/.github/workflows/deploy-ecr.yml@main
    with:
      runs_on: ${{ vars.RUNS_ON }}
      environment: ${{ vars.ENVIRONMENT }}
      ecr_repository: ${{ vars.ECR_REPOSITORY }}
      workspace: ${{ vars.WORKSPACE }}
      image_tag: ${{ needs.calculate-version.outputs.new_tag }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

  update-k8s:
    name: "🔄 Update Kubernetes"
    needs: [deploy]
    permissions:
      contents: write
    uses: vti-do2402/cicd-core/.github/workflows/update-k8s.yml@feat/update-k8s
    with:
      runs_on: ${{ vars.RUNS_ON }}
      service: database-service
      image: ${{ needs.deploy.outputs.image }}
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: "📦 Release"
    needs: [update-k8s]
    permissions:
      contents: write
    uses: vti-do2402/cicd-core/.github/workflows/tag-and-release.yml@main
    with:
      runs_on: ${{ vars.RUNS_ON }}
      default_bump: ${{ vars.VERSION_BUMP_TYPE }}
      artifacts: database-service
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-k8s:
    name: "🔄 Update Kubernetes"
    needs: [release]
    permissions:
      contents: write
    uses: vti-do2402/cicd-core/.github/workflows/update-k8s.yml@feat/update-k8s
    with:
      runs_on: ${{ vars.RUNS_ON }}
      service: database-service
      image: ${{ needs.deploy.outputs.image }}
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
